---

# PHP 7.4 is not available in the Ubuntu 22.04 archive.
- name: "Install PHP PPA prerequisites (Ubuntu 22.04)"
  become: true
  apt:
    name:
      - ca-certificates
      - software-properties-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_distribution_version is version('22.04', '==')
    - php_version | string == '7.4'

- name: "Add Ondrej PHP PPA (Ubuntu 22.04)"
  become: true
  apt_repository:
    repo: "ppa:ondrej/php"
    state: present
    update_cache: true
  when:
    - ansible_distribution_version is version('22.04', '==')
    - php_version | string == '7.4'

# Existing Ubuntu extension packages can be upgraded to PPA metapackages
# depending on the latest PHP, even when versioned extensions are requested.
- name: "Remove unversioned PHP extension packages (Ubuntu 22.04, PHP 7.4)"
  become: true
  apt:
    name:
      - php-apcu
      - php-memcache
    state: absent
  when:
    - ansible_distribution_version is version('22.04', '==')
    - php_version | string == '7.4'

- name: "Install PHP packages"
  become: "true"
  apt:
    pkg: "{{ php_packages + (php_json_packages | default([])) }}"
    state: "latest"
    update_cache: "yes"
    cache_valid_time: "3600"
    force: "yes"

# Composer and AtoM CLI tasks invoke php without a version suffix.
- name: "Select PHP CLI version (Ubuntu 22.04)"
  become: true
  command: "update-alternatives --set php /usr/bin/php{{ php_version }}"
  register: atom_php_alternative
  changed_when: atom_php_alternative.stdout | length > 0
  when: ansible_distribution_version is version('22.04', '==')

# See https://bugs.launchpad.net/ubuntu/+source/php5/+bug/1272788
- name: "Fix php5-fpm upstart"
  lineinfile:
    dest: "/etc/init/php5-fpm.conf"
    line: "reload signal USR2"
  when: "ansible_distribution_version is version('14.04', '==')"

- name: "Download memprof module source (Ubuntu >=18.04)"
  unarchive:
    src: "https://github.com/arnaud-lb/php-memory-profiler/archive/refs/tags/3.0.2.zip"
    dest: "/tmp/"
    creates: "/tmp/php-memory-profiler-3.0.2"
    copy: "no"
    owner: "root"
    group: "root"
  when:
    - atom_php_install_memprof_module|bool
    - ansible_distribution_version is version('18.04', '>=')

- name: "Build memprof extension (Bionic)"
  shell: >
    phpize &&
    ./configure &&
    make clean &&
    make &&
    cp modules/memprof.so /usr/lib/php/20170718/memprof.so
  args:
    chdir: "/tmp/php-memory-profiler-3.0.2"
    creates: "/usr/lib/php/20170718/memprof.so"
  when:
    - atom_php_install_memprof_module|bool
    - ansible_distribution_version is version('18.04', '==')

- name: "Build memprof extension (Focal)"
  shell: >
    phpize &&
    ./configure &&
    make clean &&
    make &&
    cp modules/memprof.so /usr/lib/php/20190902/memprof.so
  args:
    chdir: "/tmp/php-memory-profiler-3.0.2"
    creates: "/usr/lib/php/20190902/memprof.so"
  when:
    - atom_php_install_memprof_module|bool
    - ansible_distribution_version is version('20.04', '==')

- name: "Build memprof extension (Jammy)"
  shell: >
    phpize{{ php_version }} &&
    ./configure --with-php-config=/usr/bin/php-config{{ php_version }} &&
    make clean &&
    make &&
    cp modules/memprof.so {{ php_extension_dir }}/memprof.so
  args:
    chdir: "/tmp/php-memory-profiler-3.0.2"
    creates: "{{ php_extension_dir }}/memprof.so"
  when:
    - atom_php_install_memprof_module|bool
    - ansible_distribution_version is version('22.04', '==')

- name: "Delete memprof temp source dir (Ubuntu >=18.04)"
  file:
    state: "absent"
    path: "/tmp/php-memory-profiler-3.0.2"
  when:
    - atom_php_install_memprof_module|bool
    - ansible_distribution_version is version('18.04', '>=')

- name: "Configure memprof php extension (Ubuntu >=18.04)"
  shell: printf "extension=memprof.so\n" >> "/etc/php/{{ php_version }}/mods-available/memprof.ini"
  args:
    creates: "/etc/php/{{ php_version }}/mods-available/memprof.ini"
  when:
    - atom_php_install_memprof_module|bool
    - ansible_distribution_version is version('18.04', '>=')
