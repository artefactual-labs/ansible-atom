php_version: "{{ atom_php_version|default('8.1') }}"
php_service_name: "php{{ php_version }}-fpm"
php_packages:
  - "php{{ php_version }}-cli"
  - "php{{ php_version }}-curl"
  - "php{{ php_version }}-ldap"
  - "php{{ php_version }}-mysql"
  - "php{{ php_version }}-opcache"
  - "php{{ php_version }}-readline"
  - "php{{ php_version }}-xml"
  - "php{{ php_version }}-fpm"
  - "php{{ php_version }}-mbstring"
  - "php{{ php_version }}-xsl"
  - "php{{ php_version }}-zip"
  - "php{{ php_version }}-memcache"
  - "php{{ php_version }}-apcu"
  - "php{{ php_version }}-dev"

# JSON is built into PHP 8; only PHP 7.4 needs the separate extension.
php_json_packages: "{{ ['php7.4-json'] if php_version | string == '7.4' else [] }}"
php_extension_dir: "{{ '/usr/lib/php/20190902' if php_version | string == '7.4' else '/usr/lib/php/20210902' }}"

devbox_packages:
  - "python-is-python3"
  - "python3-pip"
  - "python-setuptools"
